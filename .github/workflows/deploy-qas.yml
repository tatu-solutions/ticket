name: Deploy QaS Automático

on:
  push:
    branches:
      - QaS
      - qas
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy para VPS (Ambiente QaS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Executar Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            echo "🚀 [GitHub Actions] Conectado à VPS. Sincronizando repositório..."
            
            APP_DIR="/var/www/tdesk"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/tatu-solutions/ticket.git"
            
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            if [ ! -d ".git" ]; then
              echo "📦 Inicializando repositório Git em $APP_DIR..."
              git init
              git remote add origin "$REPO_URL"
            else
              git remote set-url origin "$REPO_URL"
            fi
            
            echo "📥 Atualizando código a partir da branch QaS..."
            git fetch origin QaS
            git checkout -f -B QaS origin/QaS
            git reset --hard origin/QaS
            
            echo "🔧 Executando script de deploy..."
            chmod +x scripts/deploy-qas.sh
            bash scripts/deploy-qas.sh
